apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
spec:
  relicas: {{ .values.replicaCount}}

  selector:
    matchLabels:
      app: sample-app
  

  template:
    metadata:
      labels:
        app: sample-app
    
    spec:
      containers:
      - name: sample-app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: Always

        ports:
          containerPort: 80